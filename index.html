<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta name="description" content="A clear, focused workspace for your customers, leads, sales, and reports." />
    <title>Northstar CRM — Customer relationships, in focus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#dashboard" aria-label="Northstar CRM home">
          <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5 19.6 12.4 29.5 16l-9.9 3.6L16 29.5l-3.6-9.9L2.5 16l9.9-3.6L16 2.5Z"/><circle cx="16" cy="16" r="3.1"/></svg></span>
          <span class="brand-name">northstar<span>CRM</span></span>
        </a>

        <div class="workspace-switcher">
          <span class="workspace-avatar">A</span>
          <span class="workspace-copy"><strong>Acme Studio</strong><small>Growth workspace</small></span>
          <span class="switcher-chevron">⌄</span>
        </div>

        <p class="nav-label">WORKSPACE</p>
        <nav class="primary-nav">
          <button class="nav-link active" data-view="dashboard" aria-label="Overview"><span class="nav-icon" data-icon="grid"></span><span>Overview</span></button>
          <button class="nav-link" data-view="customers" aria-label="Customers"><span class="nav-icon" data-icon="users"></span><span>Customers</span><span class="nav-count" id="customer-nav-count">0</span></button>
          <button class="nav-link" data-view="leads" aria-label="Leads"><span class="nav-icon" data-icon="spark"></span><span>Leads</span><span class="nav-count" id="lead-nav-count">0</span></button>
          <button class="nav-link" data-view="sales" aria-label="Sales"><span class="nav-icon" data-icon="chart"></span><span>Sales</span></button>
          <button class="nav-link" data-view="reports" aria-label="Reports"><span class="nav-icon" data-icon="report"></span><span>Reports</span></button>
        </nav>

        <div class="sidebar-bottom">
          <div class="upgrade-card">
            <span class="upgrade-spark">✦</span>
            <strong>Make room to grow</strong>
            <p>Your team is on a roll. Keep every relationship moving forward.</p>
            <button class="upgrade-button" data-view="reports">Explore your reports <span>↗</span></button>
          </div>
          <button class="nav-link help-link" id="help-button"><span class="nav-icon" data-icon="help"></span><span>Help &amp; feedback</span></button>
          <div class="profile-card">
            <span class="profile-avatar">JD</span>
            <span class="profile-copy"><strong>Jordan Davis</strong><small>Workspace admin</small></span>
            <button class="icon-button profile-menu" aria-label="Profile menu">···</button>
          </div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb"><span>Workspace</span><span class="breadcrumb-slash">/</span><strong id="breadcrumb-current">Overview</strong></div>
          <div class="topbar-actions">
          <label class="global-search"><span data-icon="search"></span><input id="global-search" type="search" placeholder="Search this workspace..." aria-label="Search customers, leads, and deals" /><kbd>⌘ K</kbd></label>
            <button class="icon-button notification-button" aria-label="Notifications"><span data-icon="bell"></span><i></i></button>
            <span class="topbar-divider"></span>
            <span class="today-label" id="today-label"></span>
          </div>
        </header>
        <div id="page-content" class="page-content" tabindex="-1"></div>
      </main>
    </div>
    <div id="modal-root"></div>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
